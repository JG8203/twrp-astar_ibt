name: Build LineageOS 13 (astar_ibt)

on:
  workflow_dispatch:
    inputs:
      vendor_url:
        description: 'HTTPS URL of archive made by lineage/vendor_archive.py (or set LINEAGE_VENDOR_URL secret)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: lineage-13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare diagnostics
        run: mkdir -p out/lineage
      - name: Fetch and verify vendor inputs
        env:
          VENDOR_URL: ${{ inputs.vendor_url || secrets.LINEAGE_VENDOR_URL }}
        run: |
          test -n "$VENDOR_URL" || { echo 'Supply vendor_url or LINEAGE_VENDOR_URL'; exit 1; }
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' \
            "$VENDOR_URL" -o "$RUNNER_TEMP/vendor.tar.gz"
          python3 lineage/vendor_archive.py unpack "$RUNNER_TEMP/vendor.tar.gz"
          python3 lineage/verify_vendor.py
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/share/swift
          df -h /
          available=$(df -Pk . | awk 'NR==2 {print $4}')
          test "$available" -ge 83886080 || { echo 'Need at least 80 GiB free for this build attempt'; exit 1; }
      - name: Build Linux builder
        run: docker build -t astar-lineage-builder docker/
      - name: Sync and compile
        run: |
          set -o pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e JOBS=2 -e BUILD_DIR=/work/lineage/build/cm-13.0 \
            astar-lineage-builder bash lineage/build_lineage.sh 2>&1 | tee out/lineage/build.log
      - name: Collect images
        run: |
          product=lineage/build/cm-13.0/out/target/product/astar_ibt
          for name in boot system recovery; do
            test -s "$product/$name.img"
            cp "$product/$name.img" "out/lineage/$name.img"
          done
          (cd out/lineage && sha256sum boot.img system.img recovery.img > SHA256SUMS.txt)
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lineage-13-astar-ibt-logs
          path: out/lineage/*.log
          if-no-files-found: warn
      - name: Upload experimental images
        uses: actions/upload-artifact@v4
        with:
          name: lineage-13-astar-ibt-experimental
          path: |
            out/lineage/*.img
            out/lineage/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
